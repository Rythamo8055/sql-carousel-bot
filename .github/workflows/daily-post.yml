name: Daily SQL Post

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Day number to post (1-30)'
        required: true
        default: '7'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Debug: list files
        run: ls -la
      
      - name: Install dependencies
        run: npm install 2>&1 | tail -5

      - name: Install system deps
        run: |
          which curl
          which convert || which magick
          which chromium-browser || which chromium || find /opt -name 'chrome' -type f 2>/dev/null | head -1

      - name: Find Chrome for Puppeteer
        run: |
          CHROME=$(find /home -name 'chrome' -type f 2>/dev/null | head -1)
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> $GITHUB_ENV
          echo "Chrome: $CHROME"
          ls -la $CHROME

      - name: Determine day
        id: day
        run: |
          DAY=${{ github.event.inputs.day }}
          echo "day=$DAY" >> $GITHUB_OUTPUT

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          echo "=== Starting post-day.js ==="
          node post-day.js ${{ steps.day.outputs.day }} 2>&1
        continue-on-error: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            *.log
            output/
# Daily SQL Post workflow
